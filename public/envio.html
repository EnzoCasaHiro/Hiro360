<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Envio de documentos · Casa Hiro</title>
<style>
:root{--verde:#1E5C2A;--verde2:#2f7a3f;--areia:#F5EFE0;--tinta:#22302a;--mudo:#5b6a60;--linha:#d9d2bf;--card:#fff;--erro:#b3321f;--ok:#1E5C2A}
*{box-sizing:border-box}
body{margin:0;background:var(--areia);color:var(--tinta);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:0 0 40px}
header{background:var(--verde);color:#fff;padding:18px 16px}
header h1{margin:0;font-size:20px}
header p{margin:2px 0 0;font-size:14px;opacity:.9}
main{max-width:560px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--linha);border-radius:12px;padding:14px;margin:0 0 12px}
.card h2{margin:0 0 4px;font-size:16px}
.sub{color:var(--mudo);font-size:14px;margin:0}
.btn{display:inline-block;background:var(--verde);color:#fff;border:0;border-radius:10px;padding:12px 16px;font:600 15px inherit;font-family:inherit;cursor:pointer;margin-top:10px;min-height:44px}
.btn:disabled{opacity:.6}
.btn.sec{background:#fff;color:var(--verde);border:2px solid var(--verde)}
.ok{color:var(--ok);font-weight:600}
.err{color:var(--erro)}
.arq{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-top:6px;word-break:break-word}
.bar{height:6px;background:#e6e0cf;border-radius:3px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--verde2);width:0}
.nota{font-size:13px;color:var(--mudo);margin-top:18px}
input[type=file]{display:none}
:focus-visible{outline:3px solid #f0b429;outline-offset:2px}
</style>
</head>
<body>
<header><h1>Casa Hiro</h1><p id="sub">Envio de documentos</p></header>
<main id="m"><div class="card"><p class="sub">Carregando…</p></div></main>
<script>
(function(){
"use strict";
var tok=location.pathname.split("/").pop(),m=document.getElementById("m"),info=null;
function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fmt(iso){try{return new Date(iso).toLocaleDateString("pt-BR")}catch(e){return""}}
fetch("/api/envio/"+encodeURIComponent(tok),{headers:{"X-Hiro":"1"},cache:"no-store"}).then(function(r){return r.json().then(function(j){return{r:r,j:j}})}).then(function(x){
  if(!x.r.ok){m.innerHTML="";m.appendChild(el("div","card","<h2>Link indisponível</h2><p class='sub err'>"+esc((x.j&&x.j.erro)||"Não foi possível abrir este link.")+"</p>"));return}
  info=x.j;monta();
}).catch(function(){m.innerHTML="";m.appendChild(el("div","card","<h2>Sem conexão</h2><p class='sub err'>Não consegui falar com o servidor. Verifique a internet e tente de novo.</p>"))});

function monta(){
  m.innerHTML="";
  var nome=info.nome?", "+esc(info.nome):"";
  document.getElementById("sub").textContent="Envio de documentos"+(info.exp?" · vale até "+fmt(info.exp):"");
  m.appendChild(el("div","card","<h2>Olá"+nome+"!</h2><p class='sub'>A Casa Hiro pediu os documentos abaixo para o seu cadastro. Para cada um, toque em <b>Escolher</b> e tire uma foto bem nítida (sem sombra ou reflexo) ou escolha um arquivo do celular. Pode enviar frente e verso, um de cada vez.</p>"));
  var pedidos=(info.pedidos||[]).slice();
  pedidos.forEach(function(p){m.appendChild(cartao(p))});
  m.appendChild(cartao("Outros documentos",true));
  m.appendChild(el("p","nota","Seus documentos ficam guardados com segurança na Casa Hiro e são usados somente para o seu registro de trabalho, conforme a LGPD. Este link é só seu: não compartilhe."));
}
function cartao(rotulo,outros){
  var c=el("div","card"),ja=(info.enviados||[]).indexOf(rotulo)>=0&&!outros;
  c.innerHTML="<h2>"+esc(rotulo)+"</h2><p class='sub'>"+(outros?"Qualquer outro documento que a Casa Hiro tenha pedido.":"PDF ou foto.")+"</p>";
  var lista=el("div");c.appendChild(lista);
  if(ja)lista.appendChild(el("div","arq","<span class='ok'>✓ Já recebemos um arquivo deste documento</span>"));
  var inp=el("input");inp.type="file";inp.multiple=true;inp.accept="image/*,application/pdf";inp.id="f"+Math.random().toString(36).slice(2);
  var b=el("button","btn"+(ja?" sec":""),ja?"Enviar outro arquivo":"Escolher");b.type="button";b.onclick=function(){inp.click()};
  inp.onchange=function(){var fs=Array.prototype.slice.call(inp.files||[]);inp.value="";fs.reduce(function(p,f){return p.then(function(){return envia(f,rotulo,lista)})},Promise.resolve())};
  c.appendChild(inp);c.appendChild(b);return c;
}
function comprime(f){
  return new Promise(function(ok){
    if(!/^image\/(jpeg|png|webp)$/.test(f.type)||f.size<900000||!window.createImageBitmap)return ok(f);
    createImageBitmap(f).then(function(bmp){
      var k=Math.min(1,2000/Math.max(bmp.width,bmp.height)),cv=document.createElement("canvas");cv.width=Math.round(bmp.width*k);cv.height=Math.round(bmp.height*k);
      var cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(bmp,0,0,cv.width,cv.height);
      cv.toBlob(function(b){ok(b&&b.size<f.size?new File([b],f.name.replace(/\.\w+$/,"")+".jpg",{type:"image/jpeg"}):f)},"image/jpeg",.85);
    }).catch(function(){ok(f)});
  });
}
function envia(f,rotulo,lista){
  var linha=el("div","arq","<span>"+esc(f.name)+"</span><span>Enviando…</span>"),st=linha.lastChild;lista.appendChild(linha);
  return comprime(f).then(function(g){
    var tipo=g.type;
    if(!/^(application\/pdf|image\/(jpeg|png|webp))$/.test(tipo)){st.className="err";st.textContent="Formato não aceito. Envie PDF ou foto.";return}
    if(g.size>15*1048576){st.className="err";st.textContent="Passa de 15 MB.";return}
    return fetch("/api/envio/"+encodeURIComponent(tok)+"/arquivo",{method:"POST",headers:{"X-Hiro":"1","X-Type":tipo,"X-Name":encodeURIComponent(g.name||f.name),"X-Rotulo":encodeURIComponent(rotulo),"Content-Type":"application/octet-stream"},body:g}).then(function(r){
      return r.json().then(function(j){if(r.ok){st.className="ok";st.textContent="✓ Enviado"}else{st.className="err";st.textContent=(j&&j.erro)||"Não foi possível enviar."}})
    });
  }).catch(function(){st.className="err";st.textContent="Falhou. Toque em Escolher e tente de novo."});
}
})();
</script>
</body>
</html>
